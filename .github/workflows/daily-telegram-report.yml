name: Ежедневный отчет Яндекс Метрики в Telegram

on:
  schedule:
    # Каждый день в 02:00 UTC = 09:00 утра по Томску (UTC+7)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Собрать статистику Метрики 114298895 и отправить в Telegram
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_METRIKA_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNTER_ID: "114298895"
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone

          ytoken = os.environ["YANDEX_TOKEN"].strip()
          btoken = os.environ["TG_BOT_TOKEN"].strip()
          chat_id = os.environ["TG_CHAT_ID"].strip()
          cid = os.environ.get("COUNTER_ID", "114298895").strip()

          headers = {"Authorization": f"OAuth {ytoken}"}

          def ym_get(path, params=None):
              url = f"https://api-metrika.yandex.net{path}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          tomsk_tz = timezone(timedelta(hours=7))
          yday = (datetime.now(tomsk_tz) - timedelta(days=1)).strftime("%d.%m.%Y")

          # 1. Основные показатели и источники трафика за вчера
          stat = ym_get("/stat/v1/data", {
              "ids": cid,
              "metrics": "ym:s:visits,ym:s:users,ym:s:pageviews,ym:s:avgVisitDurationSeconds",
              "dimensions": "ym:s:lastTrafficSource",
              "date1": "yesterday",
              "date2": "yesterday",
              "lang": "ru",
              "accuracy": "full"
          })

          totals = stat.get("totals", [0, 0, 0, 0])
          visits = int(round(totals[0]))
          users = int(round(totals[1]))
          views = int(round(totals[2]))
          avg_sec = int(round(totals[3]))
          avg_str = f"{avg_sec // 60} мин {avg_sec % 60:02d} сек" if avg_sec >= 60 else f"{avg_sec} сек"

          sources_lines = []
          for row in stat.get("data", [])[:6]:
              sname = row["dimensions"][0].get("name", "Другое")
              sv = int(round(row["metrics"][0]))
              if sv > 0:
                  sources_lines.append(f"  • {sname}: <b>{sv}</b>")

          # 2. Достижения всех настроенных целей
          goals_lines = []
          try:
              ginfo = ym_get(f"/management/v1/counter/{cid}/goals")
              goals = ginfo.get("goals", [])
              action_goals = [g for g in goals if g.get("type") == "action"]
              chosen = action_goals if action_goals else goals[:8]
              if chosen:
                  g_metrics = ",".join(f"ym:s:goal{g['id']}reaches" for g in chosen[:10])
                  g_stat = ym_get("/stat/v1/data", {
                      "ids": cid,
                      "metrics": g_metrics,
                      "date1": "yesterday",
                      "date2": "yesterday",
                      "accuracy": "full"
                  })
                  for g, val in zip(chosen[:10], g_stat.get("totals", [])):
                      goals_lines.append(f"  • {g['name']}: <b>{int(round(val))}</b>")
          except Exception:
              pass

          lines = [
              f"📊 <b>PP TOMSK — отчёт по сайту за {yday}</b>",
              "",
              f"👥 Посетители: <b>{users}</b> (визитов: <b>{visits}</b>)",
              f"📄 Просмотров страниц: <b>{views}</b>",
              f"⏱ Среднее время на сайте: <b>{avg_str}</b>",
          ]

          if sources_lines:
              lines.append("")
              lines.append("🔎 <b>Откуда заходили:</b>")
              lines.extend(sources_lines)

          if goals_lines:
              lines.append("")
              lines.append("🎯 <b>Целевые действия на сайте:</b>")
              lines.extend(goals_lines)

          lines.append("")
          lines.append("🔗 <a href='https://metrika.yandex.ru/dashboard?id=114298895'>Открыть Яндекс Метрику</a>")

          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "\n".join(lines),
              "parse_mode": "HTML",
              "disable_web_page_preview": "true"
          }).encode("utf-8")

          tg_req = urllib.request.Request(
              f"https://api.telegram.org/bot{btoken}/sendMessage",
              data=payload,
              method="POST"
          )
          with urllib.request.urlopen(tg_req, timeout=15) as resp:
              print("Telegram sent:", resp.status)
          EOF
